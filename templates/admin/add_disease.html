{% extends "admin_base.html" %} {% block title %}Add Disease - Admin{% endblock
%} {% block navbar %}
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
  <div class="container">
    <a class="navbar-brand" href="/admin/dashboard">
      <i class="bi bi-shield-lock"></i> Admin Panel
    </a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="/"> <i class="bi bi-house"></i> Home </a>
      <a class="nav-link" href="/admin/dashboard">Dashboard</a>
      <a class="nav-link" href="/admin/diseases">Diseases</a>
      <a class="nav-link" href="/admin/logout">Logout</a>
    </div>
  </div>
</nav>
{% endblock %} {% block content %}
<div class="main-container" style="max-width: 800px">
  <div class="mb-3">
    <a href="/admin/diseases" class="btn btn-outline-secondary">
      <i class="bi bi-arrow-left"></i> Back to Diseases
    </a>
  </div>
  <h2 class="mb-4"><i class="bi bi-plus-circle"></i> Add New Disease</h2>

  <div class="card">
    <div class="card-body">
      <form method="POST">
        <div class="mb-3">
          <label for="name" class="form-label">Disease Name *</label>
          <input
            type="text"
            class="form-control"
            id="name"
            name="name"
            required
          />
        </div>

        <div class="mb-3">
          <label for="speciality" class="form-label"
            >Medical Speciality *</label
          >
          <input
            type="text"
            class="form-control"
            id="speciality"
            name="speciality"
            placeholder="e.g., Cardiology, Oncology, Physician"
            required
          />
          <small class="text-muted"
            >This will be used to match with hospital speciality
          </small>
        </div>

        <div class="mb-3">
          <label for="symptoms" class="form-label">Symptoms</label>
          <textarea
            class="form-control"
            id="symptoms"
            name="symptoms"
            rows="3"
            placeholder="Common symptoms of this disease..."
          ></textarea>
        </div>

        <div class="mb-3">
          <label for="treatment" class="form-label">Treatment</label>
          <textarea
            class="form-control"
            id="treatment"
            name="treatment"
            rows="3"
            placeholder="Common treatment methods..."
          ></textarea>
        </div>

        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check-circle"></i> Add Disease
        </button>
        <a href="/admin/diseases" class="btn btn-secondary">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
